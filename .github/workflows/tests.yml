name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  calculators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the known-answer tests
        run: python tests/test_scripts.py
